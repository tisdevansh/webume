        <h1>Devansh Agarwal</h1>
        <p>I build software people actually use, I write stories worth animating, and I'm headed for IIM Indore.</p>
        <h2>Billlion</h2>
        <p>A stock, ERP and counter-billing system: sales and GST registers, raw-material stock, job cards with stage tracking, and a monthly P&amp;L. Conceived, designed and built by me.</p>
        <h2>Vigil</h2>
        <p>A study partner for Android and Windows. Mayu the peacock blocks reels and distracting apps, checks with the camera that you are at the desk, plans your prep from the official syllabus, and tells your parents when you skip.</p>
        <h2>Sarathi</h2>
        <p>A Minecraft-animated series where Krishna ji gives Arjun updesh on Gen Z problems, in our language.</p>
        <h2>Record</h2>
        <p>Class X ICSE: 95.4% (St. George's School). Class XII Science PCM: 82.6% (Ess Ess Convent). Preparing for IPMAT 2027: IIM Indore first, then Rohtak and Shillong.</p>
